<!DOCTYPE html>
<html>
<head>
<title>Grading System</title>
<style>
body{text-align:center;font-family:Arial;margin-top:100px}
div{padding:20px;border:1px solid #ccc;width:300px;margin:auto}
input,button{padding:8px;margin:5px}
</style>
</head>

<body>
<div>
<h2>Grading System</h2>

<input id="name" placeholder="Enter Name"><br>
<input id="marks" type="number" placeholder="Enter Marks"><br>
<button onclick="grade()">Calculate</button>

<p id="result"></p>
</div>

<script>
function grade(){
    let n=document.getElementById("name").value;
    let m=Number(document.getElementById("marks").value);

    if(n=="" || m<0 || m>100)
        document.getElementById("result").innerHTML="Invalid Input";
    else if(m>=90)
        result.innerHTML=n+" : A+";
    else if(m>=80)
        result.innerHTML=n+" : A";
    else if(m>=70)
        result.innerHTML=n+" : B";
    else if(m>=60)
        result.innerHTML=n+" : C";
    else if(m>=50)
        result.innerHTML=n+" : D";
    else
        result.innerHTML=n+" : F";
}
</script>

</body>
</html>
